<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Password Vault</title>
    <style>
      html {
        width: 340px;
        min-width: 340px;
        min-height: 220px;
        background-color: #090d16;
        color: #f8fafc;
      }
      * {
        box-sizing: border-box;
      }
      body {
        width: 340px;
        min-width: 340px;
        min-height: 220px;
        margin: 0;
        padding: 16px;
        background-color: #090d16;
        color: #f8fafc;
        font-family: system-ui, -apple-system, sans-serif;
        font-size: 13px;
        overflow-x: hidden;
      }
      .header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding-bottom: 10px;
        border-bottom: 1px solid #1e293b;
        margin-bottom: 12px;
      }
      .brand {
        font-weight: 700;
        font-size: 14px;
        display: flex;
        align-items: center;
        gap: 6px;
      }
      .badge {
        font-size: 11px;
        padding: 3px 9px;
        border-radius: 999px;
        font-weight: 600;
      }
      .badge-ok {
        background: rgba(16, 185, 129, 0.15);
        color: #34d399;
      }
      .badge-locked {
        background: rgba(244, 63, 94, 0.15);
        color: #fb7185;
      }
      .domain-box {
        font-size: 12px;
        color: #94a3b8;
        margin-bottom: 10px;
        padding: 6px 10px;
        background: #0f172a;
        border-radius: 8px;
        border: 1px solid #1e293b;
      }
      .login-item {
        background: #0f172a;
        border: 1px solid #1e293b;
        border-radius: 10px;
        padding: 10px;
        margin-bottom: 8px;
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 8px;
      }
      .login-info {
        min-width: 0;
        flex: 1;
      }
      .login-user {
        font-weight: 600;
        color: #f1f5f9;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      .login-domain {
        font-size: 11px;
        color: #64748b;
      }
      .btn-fill {
        background: #4f46e5;
        color: #ffffff;
        border: none;
        border-radius: 7px;
        padding: 6px 12px;
        font-size: 12px;
        font-weight: 600;
        cursor: pointer;
        flex-shrink: 0;
      }
      .btn-fill:hover {
        background: #6366f1;
      }
      .btn-launch {
        width: 100%;
        background: #1e293b;
        color: #e2e8f0;
        border: 1px solid #334155;
        border-radius: 9px;
        padding: 9px 12px;
        font-size: 12px;
        font-weight: 600;
        cursor: pointer;
        margin-top: 10px;
      }
      .btn-launch:hover {
        background: #334155;
      }
      .empty {
        text-align: center;
        padding: 16px18px 10px;
        color: #94a3b894a3b8;
        font-size: 12px;
        background: #0f172a;
        border: 1px dashed #1e293b;
        border-radius: 10px;
      }
    </style>
  </head>
  <body>
    <div class="header">
      <div class="brand">🛡️ Password Vault</div>
      <span id="status-badge" class="badge badge-locked">Conectando...</span>
    </div>
    <div id="domain-label" class="domain-box">Detectando aba atual...</div>
    <div id="logins-list">
      <div class="empty">Consultando cofre criptográfico...</div>
    </div>
    <button id="open-app-btn" class="btn-launch">🚀 Abrir Janela do App Desktop</button>
    <button id="open-app-btn" class="btn-launch">🚀 Abrir Janela do App Desktop</button>
    <script src="popup.js"></script>
  </body>
</html>
